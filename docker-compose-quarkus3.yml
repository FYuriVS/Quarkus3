version: '3.8'

services:
  redis:
    image: redis:7.2.0
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  mongo:
    image: mongo
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: coffeeandit
      MONGO_INITDB_DATABASE: pix
    ports:
      - "27017:27017"
    volumes:
      - mongodbdata:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: coffeeandit
      ME_CONFIG_MONGODB_URL: mongodb://root:coffeeandit@mongo:27017/
    depends_on:
      - mongo

volumes:
  mongodbdata:
    driver: local
